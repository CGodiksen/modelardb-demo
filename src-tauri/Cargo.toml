[package]
name = "modelardb-demo"
version = "0.4.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "modelardb_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arrow = "59.0.0"
arrow-flight = "59.0.0"
arrow-json = "59.0.0"
bytes = "1.12.1"
bollard = "0.19.2"
datafusion = "55.1.0"
modelardb_embedded = { git = "https://github.com/ModelarData/ModelarDB-RS.git", rev = "e63c828" }
modelardb_types = { git = "https://github.com/ModelarData/ModelarDB-RS.git", rev = "e63c828" }
object_store = { version = "0.13.2", features = ["aws"] }
reqwest = { version = "0.12.23", features = ["json"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tokio = "1.48.0"
tonic = "0.14.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
futures-util = "0.3.31"
url = "2.5.8"
